<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DineDeck Guest" />
    <link rel="manifest" href="/manifest.json" />
    <title>DINEDECK — Smart Table Dining & Digital Ordering</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dinedeck_theme') || localStorage.getItem('dinedeck_app_theme');
          var isDark = false;
          if (saved === 'DARK') {
            isDark = true;
          } else if (saved === 'SYSTEM') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var doc = document.documentElement;
          if (isDark) {
            doc.classList.add('dark');
            doc.classList.remove('light', 'light-mode');
            doc.setAttribute('data-theme', 'dark');
          } else {
            doc.classList.remove('dark');
            doc.classList.add('light', 'light-mode');
            doc.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#0B0F19] text-slate-900 dark:text-slate-100 antialiased font-['Plus_Jakarta_Sans',sans-serif] selection:bg-orange-500 selection:text-white transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
