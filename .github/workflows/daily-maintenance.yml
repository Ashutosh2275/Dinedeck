name: DineDeck Daily Maintenance & Security Audit

on:
  schedule:
    # Run every day at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  daily-maintenance:
    name: Daily Integrity, Security & Health Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dinedeck_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            customer-web/package-lock.json
            partner-web/package-lock.json
            admin-web/package-lock.json

      - name: Setup Python for Brand Asset Validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Image Dependencies
        run: pip install Pillow numpy

      - name: Validate Master Brand Assets
        run: python scripts/generate_all_brand_assets.py

      - name: Backend Integrity & Prisma Validation
        working-directory: backend
        run: |
          npm ci
          npx prisma validate
          npx prisma format --check
          npx prisma generate
          npm run build

      - name: Database Schema & Migration Smoke Test
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dinedeck_prod?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test_secret_daily_ci_2026"
        run: |
          npx prisma db push
          npm run db:seed
          npm test

      - name: Validate Docker Compose Architecture
        run: docker compose config

      - name: Web Applications Health & Build Check
        run: |
          for dir in customer-web partner-web admin-web; do
            echo "Building $dir..."
            (cd $dir && npm ci && npm run build)
          done

      - name: Emit Daily Maintenance Summary
        if: always()
        run: |
          echo "## DineDeck Daily Maintenance & Health Report" >> $GITHUB_STEP_SUMMARY
          echo "Run Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Workflow Execution Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "| Checkpoint | Status | Details |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| Brand Assets & Icon Hashes | ✅ PASS | Official DineDeck emblem & distinct suite identities intact |" >> $GITHUB_STEP_SUMMARY
            echo "| Backend API & Vitest Suite | ✅ PASS | Fastify, Prisma 5, PostgreSQL 16 & Redis 7 verified |" >> $GITHUB_STEP_SUMMARY
            echo "| Web Frontend Builds | ✅ PASS | customer-web, partner-web, and admin-web compiled clean |" >> $GITHUB_STEP_SUMMARY
            echo "| Docker Compose Architecture | ✅ PASS | docker-compose.yml configuration valid & container ready |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All core commercial platform services are fully operational." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Maintenance Alert**: One or more pipeline stages failed or were skipped during this run. Review the workflow job steps for diagnostic details." >> $GITHUB_STEP_SUMMARY
          fi
