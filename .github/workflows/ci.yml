name: DineDeck CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Enforce Principle of Least Privilege across all CI workflows
permissions:
  contents: read

jobs:
  security-and-secrets-audit:
    name: Repository Security & Secrets Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan for Leaked Keystores & Private Credentials
        run: |
          echo "Scanning git-tracked files for forbidden keystores or private certificates..."
          ! git ls-files | grep -E '\.(jks|keystore|p12|pem|key)$' || {
            echo "::error::Private key or keystore file detected in git repository!"
            exit 1
          }

      - name: Verify Secret Exclusion (.env)
        run: |
          echo "Verifying no local .env files are tracked by git..."
          ! git ls-files | grep -E '^(\.env|\.env\.local|\.env\.production)$' || {
            echo "::error::Environment file containing secrets detected in git tracking!"
            exit 1
          }

  backend-test-and-build:
    name: Backend API CI (Fastify + Prisma)
    runs-on: ubuntu-latest
    needs: [security-and-secrets-audit]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dinedeck_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dinedeck_prod"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Compile TypeScript
        working-directory: backend
        run: npm run build

      - name: Push Database Schema
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dinedeck_prod?schema=public"
        run: npx prisma db push

      - name: Seed Database
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dinedeck_prod?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test_secret_ci_cd_key_2026"
        run: npm run db:seed

      - name: Run Test Suite
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dinedeck_prod?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test_secret_ci_cd_key_2026"
          PORT: 8080
          HOST: "0.0.0.0"
        run: npm test

  frontend-builds:
    name: Frontend Applications Build Check
    runs-on: ubuntu-latest
    needs: [security-and-secrets-audit]
    strategy:
      matrix:
        app: [customer-web, partner-web, admin-web]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Production Build (No Sourcemaps)
        working-directory: ${{ matrix.app }}
        run: npm run build

  docker-verification:
    name: Docker & Container Configuration Check
    runs-on: ubuntu-latest
    needs: [security-and-secrets-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        run: docker build -t dinedeck-backend:ci -f backend/Dockerfile backend

  android-ci:
    name: Android Apps CI (Customer + Partner + Admin with R8)
    runs-on: ubuntu-latest
    needs: [security-and-secrets-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Ensure Android Keystore Available
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Assemble Release APKs (Verify R8 Shrinking & Obfuscation)
        run: ./gradlew :app:assembleRelease :partner-app:assembleRelease :admin-app:assembleRelease --no-daemon --continue
