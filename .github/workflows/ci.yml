name: DineDeck CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-build:
    name: Backend API CI (Fastify + Prisma)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dinedeck_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Compile TypeScript
        working-directory: backend
        run: npm run build

      - name: Push Database Schema
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dinedeck_prod?schema=public"
        run: npx prisma db push

      - name: Seed Database
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dinedeck_prod?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test_secret_ci_cd_key_2026"
        run: npm run db:seed

      - name: Run Test Suite
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dinedeck_prod?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test_secret_ci_cd_key_2026"
          PORT: 8080
          HOST: "0.0.0.0"
        run: npm test

  frontend-builds:
    name: Frontend Applications Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer-web, partner-web, admin-web]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Production Build
        working-directory: ${{ matrix.app }}
        run: npm run build
